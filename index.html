<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<meta name="description" content="Aplikasi komunikasi berbasis gambar dan suara untuk membantu pengguna menyampaikan kebutuhan, aktivitas, dan perasaan.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>KomunikasiKu AAC</title>
<style>
:root{--bg:#101112;--header:#1b1c1e;--panel:#25272a;--card:#fff;--ink:#111;--muted:#72757a;--blue:#2396e8;--focus:#0b84ff;--danger:#d94141}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg)}
body{color:#fff}button,input,select{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--header);padding:clamp(10px,2vw,18px);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0006}
.top{display:flex;align-items:center;gap:10px;max-width:1400px;margin:auto;width:100%}.iconbtn{width:48px;height:48px;border:0;background:transparent;color:#fff;border-radius:10px;font-size:28px;cursor:pointer}.iconbtn:hover{background:#333}.title{font-size:clamp(17px,2vw,22px);font-weight:800;flex:1}.speak{border:1px solid #555;background:#282a2d;color:#fff;border-radius:14px;min-width:60px;min-height:48px;font-size:25px;cursor:pointer}.speak:active{transform:scale(.96)}
.sentence{max-width:1400px;margin:10px auto 0;width:100%;min-height:70px;background:#2b2d30;border:1px solid #47494c;border-radius:13px;padding:8px;display:flex;align-items:center;gap:7px;overflow:auto}.word{background:#fff;color:#111;border-radius:8px;padding:9px 11px;font-weight:700;white-space:nowrap}.empty{color:#b9b9b9;flex:1;text-align:center}.clear{margin-left:auto;flex:none;border:0;background:#484a4d;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}
.tabs{background:#111;display:flex;gap:6px;overflow:auto;padding:9px max(10px,calc((100% - 1400px)/2));scrollbar-width:thin}.tabs button{white-space:nowrap;background:#292b2e;border:1px solid #4a4c4f;color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}.tabs button.active{background:var(--blue);border-color:var(--blue)}
.main{width:min(1400px,100%);margin:auto;padding:0 10px 20px;flex:1}.heading{padding:12px 4px;color:#d8d8d8;font-weight:800;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.card{background:var(--card);color:var(--ink);border:0;border-radius:6px;min-height:150px;padding:12px 7px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;cursor:pointer;font-weight:800;text-align:center;box-shadow:0 1px 2px #0003}.card:hover{box-shadow:0 3px 9px #0005}.card:active{transform:scale(.975)}.card:focus-visible,.iconbtn:focus-visible,.tabs button:focus-visible,.action:focus-visible,.level:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.pic{width:86px;height:86px;display:grid;place-items:center}.pic svg{width:86px;height:86px}.label{font-size:clamp(14px,1.5vw,18px)}.sub{font-size:12px;color:#707070;font-weight:500}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.level{border:1px solid #555;background:#2a2c2f;color:#fff;border-radius:10px;padding:12px;cursor:pointer;font-weight:800}.level.active{background:var(--blue);border-color:var(--blue)}
.panel{background:#222426;border-radius:12px;padding:14px;margin:10px 0}.panel h3{margin:0 0 10px}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row label{width:120px;color:#ddd}.row input,.row select,.row textarea{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid #555;background:#fff;color:#111}.action{border:0;background:#fff;color:#111;border-radius:9px;padding:12px 14px;cursor:pointer;font-weight:800;margin:4px 0}.action.primary{background:var(--blue);color:#fff}.action.danger{background:#e74b4b;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:7px}.back{border:0;background:#303235;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;margin:10px 0}
.status{background:#0d0e0f;color:#aaa;text-align:center;font-size:12px;padding:8px}.note{color:#bbb;font-size:13px;line-height:1.5}.custom-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mini{background:#fff;color:#111;border-radius:9px;padding:10px;display:flex;align-items:center;gap:8px}.mini img{width:48px;height:48px;object-fit:contain}.mini button{margin-left:auto;border:0;background:#eee;border-radius:6px;padding:6px;cursor:pointer}
.drawer{position:fixed;inset:0;background:#0008;z-index:50;display:none}.drawer.open{display:block}.drawer-box{width:min(340px,88vw);height:100%;background:#1d1f21;padding:18px;box-shadow:5px 0 20px #0008}.drawer-box h2{margin-top:0}.drawer-link{width:100%;text-align:left;border:0;background:#292b2e;color:#fff;border-radius:9px;padding:13px;margin:4px 0;cursor:pointer}
.install{display:none}.small{font-size:12px;color:#aaa}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.card{min-height:165px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.card{min-height:175px}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.card{min-height:185px}}
@media (max-width:520px){.row{display:block}.row label{display:block;width:auto;margin-bottom:5px}.custom-list{grid-template-columns:1fr}.pic,.pic svg{width:65px;height:65px}.card{min-height:130px}}
@media (orientation:landscape) and (max-height:600px){.header{position:relative}.card{min-height:125px}}
</style>
</head>
<body>

</div>
<div class="drawer" id="drawer"><aside class="drawer-box">

<h2>KomunikasiKu</h2>

</aside></div>

draw:`<path d="M16 60l38-38 9 9-38 38H16z" fill="#f2c46b" ${c}/><path d="M53 22l6-6 9 9-5 6z" fill="#e88f8f" ${c}/><path d="M13 67h54" fill="none" ${c}/>`,
thanks:`<path d="M23 63c-4-8-7-16-7-24V25c0-3 5-3 5 0v15V18c0-4 6-4 6 0v22V14c0-4 6-4 6 0v27V19c0-4 6-4 6 0v24l5-7c3-4 8-1 6 4l-7 18c-3 7-8 10-13 10z" fill="#f0bf97" ${c}/><path d="M57 20l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f2cf6d" ${c}/>`,

default:`<circle cx="40" cy="40" r="27" fill="#eee" ${c}/><text x="40" y="48" text-anchor="middle" font-size="24">?</text>`};
return `<svg viewBox="0 0 80 80" aria-hidden="true">${m[t]||m.default}</svg>`};
const DATA={
Utama:[['yes','Ya','Ya'],['no','Tidak','Tidak'],['help','Tolong','Tolong saya'],['stop','Berhenti','Berhenti'],['help','Saya ingin','Saya ingin'],['finish','Selesai','Sudah selesai'],['happy','Suka','Saya suka'],['sad','Tidak suka','Saya tidak suka'],['happy','Senang','Saya senang'],['sad','Sedih','Saya sedih'],['help','Bantuan','Saya membutuhkan bantuan'],['help','Halo','Halo']],
Kebutuhan:[['food','Makan','Saya ingin makan'],['water','Minum','Saya ingin minum'],['toilet','Toilet','Saya ingin ke toilet'],['bath','Mandi','Saya ingin mandi'],['water','Air','Saya ingin minum air'],['sleep','Tidur','Saya ingin tidur'],['help','Obat','Saya membutuhkan obat'],['sad','Sakit','Saya merasa sakit'],['water','Dingin','Saya merasa dingin'],['happy','Panas','Saya merasa panas'],['doctor','Dokter','Saya ingin bertemu dokter'],['sad','Luka','Saya terluka']],
Aktivitas:[['learn','Belajar','Saya ingin belajar'],['play','Bermain','Saya ingin bermain'],['music','Musik','Saya ingin mendengarkan musik'],['tv','Menonton','Saya ingin menonton'],['walk','Jalan','Saya ingin berjalan'],['help','Keluar','Saya ingin keluar'],['read','Membaca','Saya ingin membaca'],['play','Puzzle','Saya ingin bermain puzzle'],['play','Olahraga','Saya ingin olahraga'],['family','Keluarga','Saya ingin bertemu keluarga'],['help','Pulang','Saya ingin pulang'],['draw','Menggambar','Saya ingin menggambar']],
Perasaan:[['happy','Senang','Saya merasa senang'],['sad','Sedih','Saya merasa sedih'],['angry','Marah','Saya merasa marah'],['fear','Takut','Saya merasa takut'],['sleep','Mengantuk','Saya mengantuk'],['sad','Tidak nyaman','Saya merasa tidak nyaman'],['happy','Sayang','Saya merasa sayang'],['happy','Tenang','Saya merasa tenang'],['happy','Sangat senang','Saya sangat senang'],['sad','Kecewa','Saya kecewa'],['help','Bingung','Saya bingung'],['happy','Percaya diri','Saya percaya diri']]};
const LEVELS={
1:[['help','Halo','Halo'],['food','Makan','Saya ingin makan'],['water','Minum','Saya ingin minum'],['toilet','Toilet','Saya ingin ke toilet'],['sleep','Tidur','Saya ingin tidur'],['help','Tolong','Tolong saya']],
2:[['bath','Mandi','Saya ingin mandi'],['learn','Belajar','Saya ingin belajar'],['play','Bermain','Saya ingin bermain'],['sleep','Istirahat','Saya ingin istirahat'],['help','Obat','Saya membutuhkan obat'],['help','Bicara','Saya ingin berbicara'],['help','Berjalan','Saya ingin berjalan'],['help','Pulang','Saya ingin pulang']],
3:[['help','Perhatian','Saya membutuhkan perhatian'],['help','Berbicara','Saya ingin berbicara'],['help','Bertanya','Saya ingin bertanya'],['family','Keluarga','Saya ingin bertemu keluarga'],['learn','Sekolah','Saya ingin pergi ke sekolah'],['doctor','Dokter','Saya ingin bertemu dokter'],['help','Telepon','Saya ingin menelepon seseorang'],['thanks','Terima kasih','Terima kasih']]};
let current='Utama',level=1,words=[];
const $=s=>document.querySelector(s),main=$('#main'),tabs=$('#tabs'),sentence=$('#sentence'),status=$('#status');
const cats=[['Utama','⭐ Utama'],['Kebutuhan','🍽️ Kebutuhan'],['Aktivitas','🏃 Aktivitas'],['Perasaan','😊 Perasaan'],['Level','🎯 Level'],['More','⋮ More']];
function say(t){status.textContent='🔊 '+t;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=Number(localStorage.aacRate||.9);u.volume=Number(localStorage.aacVol||1);speechSynthesis.speak(u)}}
function renderTabs(){tabs.innerHTML='';cats.forEach(([key,label])=>{let b=document.createElement('button');b.textContent=label;b.className=current===key?'active':'';b.onclick=()=>{current=key;render()};tabs.appendChild(b)})}
function renderSentence(){sentence.querySelectorAll('.word,.empty').forEach(x=>x.remove());if(!words.length){let e=document.createElement('div');e.className='empty';e.textContent='Ketuk gambar untuk menyusun kalimat';sentence.insertBefore(e,$('#clear'));return}words.forEach(w=>{let x=document.createElement('span');x.className='word';x.textContent=w;sentence.insertBefore(x,$('#clear'))})}
function add(item){words.push(item[2]);if(words.length>8)words.shift();renderSentence();say(item[2])}
function card(item){let b=document.createElement('button');b.className='card';b.innerHTML=`<span class="pic">${svg(item[0])}</span><span class="label">${item[1]}</span>`;b.onclick=()=>add(item);return b}
function grid(title,arr){main.innerHTML=`<div class="heading">${title}</div><div class="grid" id="grid"></div>`;arr.forEach(x=>$('#grid').appendChild(card(x)))}
function renderLevel(){main.innerHTML='<div class="heading">Pilih tingkat aktivitas</div><div class="levels" id="levels"></div><div class="grid" id="grid"></div>';[1,2,3].forEach(n=>{let b=document.createElement('button');b.className='level '+(n===level?'active':'');b.innerHTML=`Level ${n}<br><small>${n===1?'Dasar':n===2?'Menengah':'Lanjutan'}</small>`;b.onclick=()=>{level=n;renderLevel()};$('#levels').appendChild(b)});LEVELS[level].forEach(x=>$('#grid').appendChild(card(x)))}
function renderMore(){main.innerHTML=`<button class="back" id="back">← Kembali</button><div class="heading">More — Pengaturan & Personalisasi</div><section class="panel"><h3>🔊 Pengaturan suara</h3><div class="row"><label>Kecepatan</label><input id="rate" type="range" min=".5" max="1.5" step=".1" value="${localStorage.aacRate||.9}"></div><div class="row"><label>Volume</label><input id="vol" type="range" min="0" max="1" step=".1" value="${localStorage.aacVol||1}"></div><button class="action primary" id="test">🔊 Tes suara</button></section><section class="panel"><h3>📱 Penggunaan perangkat</h3><p class="note">Web ini responsif untuk ponsel, tablet, laptop, dan desktop. Jika browser mendukung PWA, aplikasi juga dapat dipasang ke layar utama.</p><button class="action" id="install" style="display:none">➕ Pasang ke perangkat</button></section><section class="panel"><h3>🧩 Personalisasi</h3><p class="note">Versi pengembangan berikutnya dapat menyimpan kartu gambar dan rekaman suara pengguna secara lokal di perangkat.</p><div class="actions"><button class="action" id="clear">🗑️ Kosongkan kalimat</button><button class="action" id="home2">🏠 Beranda</button></div></section>`;$('#back').onclick=()=>{current='Utama';render()};$('#rate').oninput=e=>localStorage.aacRate=e.target.value;$('#vol').oninput=e=>localStorage.aacVol=e.target.value;$('#test').onclick=()=>say('Halo, ini adalah suara komunikasi saya.');$('#clear').onclick=()=>{words=[];renderSentence()};$('#home2').onclick=()=>{current='Utama';render()};if(deferredPrompt){$('#install').style.display='block';$('#install').onclick=async()=>{deferredPrompt.prompt();deferredPrompt=null}}}
function render(){renderTabs();if(current==='Level')return renderLevel();if(current==='More')return renderMore();grid(current==='Utama'?'Pilihan komunikasi utama':current,DATA[current]||DATA.Utama)}
$('#menu').onclick=()=>$('#drawer').classList.add('open');$('#closeMenu').onclick=()=>$('#drawer').classList.remove('open');document.querySelectorAll('.drawer-link').forEach(b=>b.onclick=()=>{current=b.dataset.go;$('#drawer').classList.remove('open');render()});$('#speak').onclick=()=>words.length?say(words.join(' ')):status.textContent='Belum ada kalimat';$('#clear').onclick=()=>{words=[];renderSentence();status.textContent='Kalimat dikosongkan'};let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});renderSentence();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
